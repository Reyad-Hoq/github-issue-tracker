<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- icon -->
  <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
  <!-- tailwind & daisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- fontstyle -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Github | Login</title>
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen mx-auto flex justify-center items-center bg-base-300">

  <section class="form md:w-1/3" id="input-enter">
    <div class="card bg-base-100 shrink-0 mx-auto rounded-xl p-10">
      <div class="logo flex flex-col justify-center items-center gap-3">
        <img class="w-min" src="./assets/github-logo.png" alt="Payoo Logo">
        <h2 class="text-3xl font-semibold">GitHub Issues Tracker</h2>
        <p class="text-gray-500 text-[16px]">Sign in to manage your issues</p>
      </div>
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label font-bold text-neutral">Username</label>
          <input type="text" class="input w-full rounded-lg py-6 px-5" placeholder="Enter Username" id="input-name" />
          <label class="text-primary">Default: admin</label>
          <br>
          <label class="label font-bold text-neutral">Password</label>
          <input type="password" class="input  w-full rounded-lg py-6 px-5" placeholder="Enter Password" minlength="8"
            id="input-password" />
          <label class="text-primary">Default: admin123</label>
          <button class="btn btn-primary mt-4 rounded-lg py-6 px-5" id="login-btn">Sign In</button>
        </fieldset>
      </div>
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="mx-4 text-gray-500">OR</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>
      <div class="mx-auto text-center space-y-1">
        <p>Demo Credentials:</p>
        <P><strong>Username:</strong> admin</P>
        <p><strong>Password:</strong> admin123</p>
      </div>
    </div>
  </section>

  <script src="login.js"></script>
  <script src="home.js"></script>
</body>

</html>
