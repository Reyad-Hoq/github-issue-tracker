<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- icon -->
  <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
  <!-- tailwind & daisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- fontstyle -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- icon style  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Job Application Tracker</title>
  <title>Home | Github Issue Tracker</title>
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>

<body class="bg-base-200 space-y-14">
  <header class="w-full border-b-1 border-gray-200 shadow-sm bg-white">
    <div class="navbar w-11/12 mx-auto bg-base-100">
      <div class=" flex gap-2 items-center flex-1">
        <img class="w-[50px]" src="./assets/github-logo.png" alt="">
        <h2 class=" text-2xl">GitHub Issues Tracker</h2>
      </div>
      <div class="flex gap-2">
        <input type="text" placeholder="Search issues..." class="input input-bordered w-24 md:w-auto" />
        <button class="btn btn-primary">+ New Issue </button>
      </div>
    </div>
    </div>
  </header>
  <section class="bg-white w-10/12 mx-auto p-6 rounded-lg shadow-sm">
    <button id="all-btn" class="btn btn-primary w-1/10">All</button>
    <button id="open-btn" class="btn btn-outline btn-primary w-1/10">Open</button>
    <button id="closed-btn" class="btn btn-outline btn-primary w-1/10">Closed</button>
  </section>
</body>

</html>
